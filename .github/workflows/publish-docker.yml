name: Publish Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: ripwords/bambudeck

jobs:
  verify:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo 'version=edge' >> "$GITHUB_OUTPUT"
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo 'stable=false' >> "$GITHUB_OUTPUT"
            else
              echo 'stable=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run docs:build
      - run: docker compose -f compose.production.yaml config --quiet
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.stable == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.verify.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=BambuDeck
            org.opencontainers.image.description=Private LAN dashboard for Bambu Lab printers
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=bambudeck-release
          cache-to: type=gha,scope=bambudeck-release,mode=max,ignore-error=true
      - name: Record image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Published `%s:%s`\n\nDigest: `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  release:
    if: github.event_name == 'push'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment asset
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p release
          python3 - <<'PY'
          import os
          import pathlib
          import re
          source = pathlib.Path('compose.production.yaml').read_text()
          image = os.environ['IMAGE'] + ':' + os.environ['VERSION']
          result, count = re.subn(r'(?m)^(\s*image:)\s*.*$', lambda match: match[1] + ' ' + image, source)
          if count != 1:
              raise SystemExit('Expected exactly one image in production compose')
          pathlib.Path('release/compose.production.yaml').write_text(result)
          PY
          cd release
          sha256sum compose.production.yaml > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          STABLE: ${{ needs.verify.outputs.stable }}
        run: |
          printf 'Docker image: `%s:%s`\n\nDownload `compose.production.yaml`, then run:\n\n```sh\ndocker compose -f compose.production.yaml up -d\n```\n\nDocumentation: https://ripwords.github.io/BambuDeck/\n' "$IMAGE" "$VERSION" > release/notes.md
          flags=()
          if [[ "$STABLE" != 'true' ]]; then
            flags+=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "BambuDeck $VERSION" --notes-file release/notes.md "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "BambuDeck $VERSION" --notes-file release/notes.md "${flags[@]}"
          fi
          gh release upload "$TAG" release/compose.production.yaml release/SHA256SUMS --clobber
