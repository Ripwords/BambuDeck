services:
  dashboard:
    image: ripwords/bambudeck:${BAMBUDECK_VERSION:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - dashboard-data:/data
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      DISCOVERY_TIMEOUT_MS: ${DISCOVERY_TIMEOUT_MS:-15000}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  dashboard-data:
